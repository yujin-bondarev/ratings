spring.application.name=ratings-microservice
spring.main.allow-bean-definition-overriding=true

dean.logging.enabled=false
app.version=dev
dean.templates.path=disabled


# ?? PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ratings
spring.datasource.username=postgres
spring.datasource.password=testpass
spring.datasource.driver-class-name=org.postgresql.Driver



# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger
springdoc.swagger-ui.disable-swagger-default-url=false
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=none

# ???????????? (???? ???????????)
auth.public-urls=/api/**,/swagger-ui/**,/v3/api-docs/**
auth.needValidation=false
auth.validateUrl=http://localhost/dummy
auth.resourceIds=ratings
auth.url=http://localhost/dummy
token.signing.key=dummy-key
auth.me.url=http://localhost/dummy



